# ==========================================
# APPLICATION
# ==========================================

spring.application.name=api


# ==========================================
# PROFILES
# ==========================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


# ==========================================
# JPA
# ==========================================

spring.jpa.open-in-view=false


# ==========================================
# FLYWAY
# ==========================================

spring.flyway.enabled=true

# ==========================================
# SECURITY / JWT
# ==========================================
security.token.secret=${JWT_SECRET:change-this-development-secret-at-least-32-chars}
security.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800}